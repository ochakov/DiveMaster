name: Release

# Builds both APKs (watch + phone) and attaches them to a GitHub Release
# whenever a v* tag is pushed. Manual runs (workflow_dispatch) build and
# upload the APKs as a workflow artifact without creating a release.
#
# Signing: without secrets, CI signs with a per-run debug keystore — the
# watch and phone APKs of one release still match each other (Data Layer
# sync works), but every release carries a NEW signature, so updating
# requires uninstalling first. For a stable signature add these repository
# secrets:
#   DIVEMASTER_KEYSTORE_BASE64    base64 of the keystore file
#   DIVEMASTER_KEYSTORE_PASSWORD
#   DIVEMASTER_KEY_ALIAS
#   DIVEMASTER_KEY_PASSWORD
# Generate a keystore with:
#   keytool -genkeypair -v -keystore divemaster-release.keystore \
#     -alias divemaster -keyalg RSA -keysize 4096 -validity 10000

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.DIVEMASTER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DIVEMASTER_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew :core:deco:test :core:engine:test

      - name: Build watch and phone release APKs
        env:
          DIVEMASTER_KEYSTORE_PASSWORD: ${{ secrets.DIVEMASTER_KEYSTORE_PASSWORD }}
          DIVEMASTER_KEY_ALIAS: ${{ secrets.DIVEMASTER_KEY_ALIAS }}
          DIVEMASTER_KEY_PASSWORD: ${{ secrets.DIVEMASTER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :mobile:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DiveMaster-watch-${GITHUB_REF_NAME}.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/DiveMaster-phone-${GITHUB_REF_NAME}.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divemaster-apks
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
